[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "globalcontext"
version = "0.1.0"
description = "Share context across terminal AI coding assistants"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Global Context Contributors"}
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.scripts]
globalcontext = "globalcontext.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR_USER/globalcontext"
Repository = "https://github.com/YOUR_USER/globalcontext"

[tool.setuptools.packages.find]
where = ["."]
include = ["globalcontext*"]
