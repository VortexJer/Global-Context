name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run pytest
        run: pytest tests/ -v

      - name: CLI smoke tests (Unix)
        if: runner.os != 'Windows'
        run: |
          set -e
          export PATH="$PWD/bin:$PATH"
          cd /tmp
          rm -rf gc-smoke && mkdir gc-smoke && cd gc-smoke
          globalcontext init
          globalcontext status
          globalcontext append <(echo "Smoke test") --label CI
          globalcontext checkpoint --ai CI --summary "smoke"
          globalcontext checkpoint-complete --ai CI --text "Smoke entry"
          globalcontext recover
          globalcontext status --show

      - name: CLI smoke tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$PWD\bin;$env:PATH"
          $tmp = "$env:TEMP\gc-smoke"
          if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }
          New-Item -ItemType Directory -Path $tmp | Out-Null
          Set-Location $tmp
          globalcontext init
          globalcontext status
          "Smoke test" | Out-File -FilePath smoke.txt -Encoding utf8
          globalcontext append smoke.txt --label CI
          globalcontext checkpoint --ai CI --summary "smoke"
          globalcontext checkpoint-complete --ai CI --text "Smoke entry"
          globalcontext recover
          globalcontext status --show

      - name: Local installer smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          set -e
          rm -rf "$HOME/.globalcontext-smoke-test"
          GC_INSTALL_DIR="$HOME/.globalcontext-smoke-test" ./install.sh --local --ai all
          test -f "$HOME/.globalcontext-smoke-test/bin/globalcontext.py"

      - name: Local installer smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installDir = "$env:USERPROFILE\.globalcontext-smoke-test"
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          & ./install.ps1 -InstallDir $installDir -Ai all
          if (-not (Test-Path "$installDir\bin\globalcontext.py")) { throw "Installer did not copy globalcontext.py" }
